apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-workspace
  namespace: mifos-pi-agent
  labels:
    app.kubernetes.io/name: mifos-pi-agent
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pi-agent-data
  namespace: mifos-pi-agent
  labels:
    app.kubernetes.io/name: mifos-pi-agent
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
