apiVersion: v1
kind: Secret
metadata:
  name: mifos-pi-agent-secrets
  namespace: mifos-pi-agent
  labels:
    app.kubernetes.io/name: mifos-pi-agent
type: Opaque
stringData:
  # ── Fineract credentials ─────────────────────────────────────────
  FINERACT_BASE_URL: "https://sandbox.mifos.community/fineract-provider/api/v1"
  FINERACT_USERNAME: "mifos"
  FINERACT_PASSWORD: "password"
  FINERACT_TENANT_ID: "default"
  # ── LLM provider key (set at least one) ──────────────────────────
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  GOOGLE_API_KEY: ""
