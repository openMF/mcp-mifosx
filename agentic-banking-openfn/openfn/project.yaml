# OpenFn Lightning project specification – Agentic Loan Origination
# Deploy with: openfn deploy -p project.yaml  (or push via Lightning GitHub sync)
#
# Docs: https://docs.openfn.org/documentation/legacy/portability
name: agentic-loan-origination
description: >
  Durable multi-step loan underwriting for Mifos/Fineract.
  Replaces Temporal SupervisorWorkflow with OpenFn Lightning jobs.
  Spring Boot Agentic Gateway owns HITL + status queries; OpenFn owns step execution.

# Lightning credential used by the Fineract write-back job. It must exist before deploying:
# a raw JSON credential named "fineract", owned by the Lightning user below
# (change owner to your Lightning user's email).
credentials:
  super@openfn.org-fineract:
    name: fineract
    owner: super@openfn.org

workflows:
  # -------------------------------------------------------------------------
  # Workflow 1: Auto underwriting (triggered by gateway POST /api/loans/submit)
  # -------------------------------------------------------------------------
  loan-submit:
    name: Loan Submit – Auto Underwriting
    jobs:
      normalize-application:
        name: Normalize Application
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          // state.data is the webhook body from the Agentic Gateway
          fn(state => {
            const app = state.data || {};
            console.log('normalize-application', app.workflowId);
            return {
              ...state,
              application: {
                workflowId: app.workflowId,
                applicantId: app.applicantId,
                fullName: app.fullName,
                email: app.email,
                phone: app.phone,
                requestedAmount: Number(app.requestedAmount),
                termMonths: Number(app.termMonths || 12),
                purpose: app.purpose || 'GENERAL',
                applicationDate: app.applicationDate,
                documentPaths: app.documentPaths || [],
                metadata: app.metadata || {}
              },
              gatewayBaseUrl: app.gatewayBaseUrl || 'http://host.docker.internal:8080',
              callbackSecret: app.callbackSecret || '',
              ollamaUrl: app.ollamaUrl || 'http://host.docker.internal:11434',
              ollamaModel: app.ollamaModel || 'llama3.2:latest',
              visionModel: app.visionModel || 'qwen2.5vl:3b',
              curpMaxIssueAgeDays: Number(app.curpMaxIssueAgeDays || 30),
              // Rendered page images; dropped again after process-documents
              documents: app.documents || [],
              data: { ...app, documents: undefined }
            };
          });

      notify-gathering:
        name: Notify Gateway – GATHERING_DATA
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          post(
            `${$.gatewayBaseUrl}/api/openfn/callback/status`,
            {
              workflowId: $.application.workflowId,
              phase: 'GATHERING_DATA'
            },
            {
              headers: {
                'Content-Type': 'application/json',
                'X-OpenFn-Secret': $.callbackSecret
              }
            }
          );

      fetch-bank-and-credit:
        name: Fetch Bank + Credit (parallel simulation)
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          // In production: use language-http against real bank / CIBIL / Experian APIs
          // with independent retries. Here we simulate durable data gathering.
          fn(state => {
            const amount = state.application.requestedAmount;
            const bankData = {
              provider: 'mock-bank',
              averageBalance: amount * 1.8,
              salaryCreditsLast3Months: 3,
              bouncedCheques: 0
            };
            // CIBIL → Experian fallback pattern (same idea as Temporal retry policy)
            let creditReport = {
              bureau: 'CIBIL',
              score: 720,
              accounts: 4,
              delinquencies: 0
            };
            if (creditReport.score < 0) {
              creditReport = { bureau: 'Experian', score: 705, accounts: 3, delinquencies: 0 };
            }
            console.log('bank+credit fetched for', state.application.workflowId);
            return { ...state, bankData, creditReport };
          });

      process-documents:
        name: Process Documents (CURP vision)
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          // CURP constancias (RENAPO) are read by a local Ollama vision model, then validated
          // like agentic-banking-temporal's CurpDocumentAgent: clave format, name match,
          // "CURP Certificada: verificada con el Registro Civil" and issue date age.
          // The gateway renders the PDF's first page to PNG (documents[].imageBase64).
          fn(async state => {
            const { application, ollamaUrl, visionModel, curpMaxIssueAgeDays } = state;
            const documents = state.documents || [];

            const VISION_PROMPT = [
              'You are a document specialist for Mexican CURP constancias issued by RENAPO.',
              'Extract the fields from the image and return ONLY a valid JSON object. Do not include markdown formatting, explanations, or thinking tags.',
              '',
              '{',
              '  "curpClave": "18-character code",',
              '  "fullName": "Full name as printed on document",',
              '  "registrationEntity": "State of registration",',
              '  "issueDate": "YYYY-MM-DD",',
              '  "civilRegistryVerified": true,',
              '  "confidence": 0.95',
              '}',
              '',
              'IMPORTANT: Set "civilRegistryVerified" to true ONLY if the document explicitly contains BOTH phrases: "CURP Certificada" AND "verificada con el Registro Civil".'
            ].join('\n');

            const CURP_CLAVE = /\b([A-Z]{4}\d{6}[HM][A-Z]{5}[0-9A-Z]\d)\b/;
            const CURP_FORMAT = /^[A-Z]{4}\d{6}[HM][A-Z]{5}[0-9A-Z]\d$/;
            const MONTHS_ES = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8,
              septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };
            const normalizeName = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
              .toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim();
            const firstText = (o, ...keys) => {
              for (const k of keys) {
                const v = o && o[k];
                if (v != null && String(v).trim() && String(v).toLowerCase() !== 'null') return String(v);
              }
              return null;
            };

            const extract = raw => {
              const cleaned = raw.replace(/<think>[\s\S]*?<\/think>/g, ' ').replace(/```(?:json)?/g, ' ').trim();
              const doc = { type: 'CURP' };
              try {
                const json = JSON.parse(cleaned.slice(cleaned.indexOf('{'), cleaned.lastIndexOf('}') + 1));
                const clave = firstText(json, 'curpClave', 'curp', 'clave', 'claveCurp', 'CURP');
                if (clave) doc.curpClave = clave.toUpperCase().replace(/\s+/g, '');
                const name = firstText(json, 'fullName', 'nombre', 'name', 'nombreCompleto');
                if (name) doc.fullName = name.trim().toUpperCase();
                doc.registrationEntity = firstText(json, 'registrationEntity', 'entidad', 'entidadRegistro');
                const issue = firstText(json, 'issueDate', 'fechaEmision', 'fecha', 'date');
                if (issue && /^\d{4}-\d{2}-\d{2}/.test(issue.trim())) doc.issueDate = issue.trim().slice(0, 10);
                doc.civilRegistryVerified = json.civilRegistryVerified === true;
                if (json.confidence != null) doc.confidence = Number(json.confidence);
              } catch (e) {
                console.log('Vision JSON parse failed, using text fallbacks:', e.message);
              }
              // Text fallbacks (the model sometimes answers in prose)
              const upper = cleaned.toUpperCase();
              if (!doc.curpClave) {
                const m = upper.replace(/\s+/g, '').match(CURP_CLAVE) || upper.match(CURP_CLAVE);
                if (m) doc.curpClave = m[1];
              }
              if (!doc.fullName) {
                const m = upper.match(/NOMBRE\s*:?\s*([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ ]{4,80})/);
                if (m) doc.fullName = m[1].replace(/\s+/g, ' ').trim();
              }
              if (!doc.issueDate) {
                const m = cleaned.match(/(\d{1,2})\s+de\s+([a-záéíóúñ]+)\s+de\s+(\d{4})/i);
                const month = m && MONTHS_ES[m[2].toLowerCase()];
                if (month) doc.issueDate = `${m[3]}-${String(month).padStart(2, '0')}-${m[1].padStart(2, '0')}`;
              }
              if (!doc.civilRegistryVerified && /CURP\s+Certificada/i.test(cleaned) && /verificada\s+con\s+el\s+Registro\s+Civil/i.test(cleaned)) {
                doc.civilRegistryVerified = true;
              }
              return doc;
            };

            const validate = doc => {
              const messages = [];
              const expected = normalizeName(application.fullName);
              const actual = normalizeName(doc.fullName);
              const tokens = s => [...new Set(s.split(' '))].sort().join(' ');
              const nameOk = !!expected && !!actual &&
                (actual === expected || actual.includes(expected) || expected.includes(actual) || tokens(actual) === tokens(expected));
              messages.push(nameOk
                ? `Name match OK: application name matches CURP name '${doc.fullName}'`
                : `Name mismatch: expected '${application.fullName}' vs CURP '${doc.fullName}'`);

              const claveOk = !!doc.curpClave && CURP_FORMAT.test(doc.curpClave);
              const registryOk = claveOk && doc.civilRegistryVerified === true;
              messages.push(registryOk
                ? `Civil Registry OK: certified CURP with clave ${doc.curpClave}`
                : !claveOk
                  ? 'Civil Registry FAIL: CURP clave missing or invalid format'
                  : "Civil Registry FAIL: missing required text 'CURP Certificada: verificada con el Registro Civil'");

              let dateOk = false;
              if (doc.issueDate) {
                const age = Math.floor((Date.now() - Date.parse(`${doc.issueDate}T00:00:00Z`)) / 86400000);
                dateOk = age >= 0 && age <= curpMaxIssueAgeDays;
                messages.push(dateOk
                  ? `Issue date OK: ${doc.issueDate} (${age} days old, max ${curpMaxIssueAgeDays})`
                  : age < 0
                    ? `Issue date FAIL: ${doc.issueDate} is in the future`
                    : `Issue date FAIL: ${doc.issueDate} is ${age} days old (max ${curpMaxIssueAgeDays})`);
              } else {
                messages.push('Issue date FAIL: could not extract issue date from CURP document');
              }
              return { nameOk, registryOk, dateOk, valid: nameOk && registryOk && dateOk, messages };
            };

            const docResults = [];
            for (const d of documents) {
              const result = { path: d.path, docType: d.docType };
              if (d.error || !d.imageBase64) {
                docResults.push({ ...result, valid: false, validationMessages: [`Document not readable: ${d.error || 'no image'}`] });
                continue;
              }
              if (d.docType !== 'CURP') {
                docResults.push({ ...result, valid: false, extracted: { type: d.docType },
                  validationMessages: ['Generic extraction not implemented (only CURP documents are analysed)'] });
                continue;
              }
              try {
                console.log(`Calling Ollama vision model=${visionModel} for ${d.path}`);
                const res = await post(`${ollamaUrl}/api/chat`, {
                  model: visionModel,
                  messages: [{ role: 'user', content: VISION_PROMPT, images: [d.imageBase64] }],
                  stream: false,
                  think: false,
                  options: { temperature: 0.1, num_predict: 2048 }
                }, { timeout: 300000 })(state);
                const message = res.data?.message || {};
                const raw = String(message.content || message.thinking || res.data?.response || '');
                const extracted = extract(raw);
                const check = validate(extracted);
                extracted.nameMatches = check.nameOk;
                extracted.registryOk = check.registryOk;
                extracted.issueDateOk = check.dateOk;
                docResults.push({ ...result, valid: check.valid, extracted, validationMessages: check.messages,
                  visionModel, visionRaw: raw.slice(0, 3000) });
                console.log('CURP review', JSON.stringify({ valid: check.valid, clave: extracted.curpClave, name: extracted.fullName }));
              } catch (e) {
                docResults.push({ ...result, valid: false, visionModel,
                  validationMessages: [`Vision model unavailable or failed: ${e.message}`] });
                console.log(`Vision failed for ${d.path}: ${e.message}`);
              }
            }

            // Drop the page images: they are large and not needed by later steps
            return { ...state, documents: undefined, docResults };
          });

      specialist-assessments:
        name: Specialist Assessments (Income / Expense / Credit)
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          fn(state => {
            const { application, bankData, creditReport } = state;
            const amount = application.requestedAmount;

            const income = {
              type: 'INCOME',
              verdict: bankData.salaryCreditsLast3Months >= 2 ? 'PASS' : 'REFER',
              score: bankData.salaryCreditsLast3Months >= 2 ? 0.85 : 0.5,
              rationale: `Salary credits last 3 months: ${bankData.salaryCreditsLast3Months}`
            };
            const expense = {
              type: 'EXPENSE',
              verdict: bankData.bouncedCheques === 0 ? 'PASS' : 'FAIL',
              score: bankData.bouncedCheques === 0 ? 0.8 : 0.3,
              rationale: `Bounced cheques: ${bankData.bouncedCheques}`
            };
            const credit = {
              type: 'CREDIT',
              verdict: creditReport.score >= 650 ? 'PASS' : creditReport.score >= 550 ? 'REFER' : 'FAIL',
              score: Math.min(1, creditReport.score / 900),
              rationale: `${creditReport.bureau} score ${creditReport.score}`
            };

            // High ticket → force REFER
            if (amount > 50000 && credit.verdict === 'PASS') {
              credit.verdict = 'REFER';
              credit.rationale += ' (high amount – human review required)';
            }

            return {
              ...state,
              assessments: [income, expense, credit]
            };
          });

      ollama-decide:
        name: Ollama Aggregate Decision
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          // Local Ollama aggregates the specialist assessments into a decision (same prompt
          // contract as agentic-banking-temporal). If Ollama is down or returns invalid JSON,
          // the rule-based decision below is used instead.
          fn(async state => {
            const { application, assessments, bankData, creditReport, docResults, ollamaUrl, ollamaModel } = state;

            const fails = assessments.filter(a => a.verdict === 'FAIL').length;
            const refers = assessments.filter(a => a.verdict === 'REFER').length;
            const rules = fails > 0
              ? { recommendation: 'REJECT', confidence: 0.8, riskLevel: 'HIGH', rationale: 'One or more specialist assessments failed.' }
              : refers > 0
                ? { recommendation: 'REFER', confidence: 0.65, riskLevel: 'MEDIUM', rationale: 'Borderline assessments – human review required.' }
                : { recommendation: 'APPROVE', confidence: 0.78, riskLevel: 'LOW', rationale: 'All specialist assessments passed.' };

            const prompt = [
              'You are an expert loan underwriter agent running on-premise.',
              'Analyse the following loan application data and return ONLY a valid JSON object',
              'with no additional text, markdown or explanation.',
              '',
              'Required JSON schema:',
              '{',
              '  "recommendation": "APPROVE" | "REJECT" | "REFER",',
              '  "confidence": number between 0 and 1,',
              '  "summary": "concise 2-4 sentence rationale",',
              '  "riskLevel": "LOW" | "MEDIUM" | "HIGH"',
              '}',
              '',
              'Data:',
              JSON.stringify({
                application,
                assessments,
                bank: bankData,
                credit: creditReport,
                documents: (docResults || []).map(d => ({ docType: d.docType, valid: d.valid, validationMessages: d.validationMessages }))
              }, null, 2),
              '',
              'Rules:',
              '- Prefer APPROVE only when income, expense and credit assessments all passed and risk is LOW/MEDIUM.',
              '- Prefer REJECT when credit score is weak or disposable income is insufficient.',
              '- Use REFER when data is incomplete or borderline.'
            ].join('\n');

            try {
              console.log(`Calling Ollama model=${ollamaModel} at ${ollamaUrl}`);
              const res = await post(`${ollamaUrl}/api/generate`, {
                model: ollamaModel,
                prompt,
                stream: false,
                format: 'json',
                options: { temperature: 0.1 }
              }, { timeout: 180000 })(state);

              const raw = String(res.data?.response || '');
              const json = JSON.parse(raw.slice(raw.indexOf('{'), raw.lastIndexOf('}') + 1));
              const recommendation = String(json.recommendation || '').toUpperCase();
              if (!['APPROVE', 'REJECT', 'REFER'].includes(recommendation)) {
                throw new Error(`Unexpected recommendation: ${json.recommendation}`);
              }
              const confidence = Math.min(1, Math.max(0, Number(json.confidence)));
              const aiDecision = {
                recommendation,
                confidence: Number.isFinite(confidence) ? confidence : rules.confidence,
                rationale: json.summary || rules.rationale,
                riskLevel: String(json.riskLevel || rules.riskLevel).toUpperCase(),
                source: 'ollama',
                model: ollamaModel,
                raw
              };

              // Guardrail: the LLM may be stricter than the assessments, never more lenient
              const severity = { APPROVE: 0, REFER: 1, REJECT: 2 };
              if (severity[recommendation] < severity[rules.recommendation]) {
                aiDecision.guardrail = `LLM recommended ${recommendation}, but the specialist assessments require ` +
                  `${rules.recommendation} (${rules.rationale})`;
                aiDecision.recommendation = rules.recommendation;
                aiDecision.rationale = `${aiDecision.rationale} [Guardrail: ${aiDecision.guardrail}]`;
                console.log(aiDecision.guardrail);
              }
              console.log('Ollama decision', JSON.stringify(aiDecision));
              return { ...state, aiDecision };
            } catch (e) {
              console.log(`Ollama unavailable or invalid response (${e.message}); using rule-based decision`);
              return { ...state, aiDecision: { ...rules, source: 'rules-fallback', model: ollamaModel, error: e.message } };
            }
          });

      callback-gateway:
        name: Callback Gateway – PENDING_HUMAN_REVIEW
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          post(
            `${$.gatewayBaseUrl}/api/openfn/callback/underwriting-complete`,
            {
              workflowId: $.application.workflowId,
              recommendation: $.aiDecision.recommendation,
              confidence: $.aiDecision.confidence,
              rationale: $.aiDecision.rationale,
              assessments: $.assessments,
              context: {
                bank: $.bankData,
                credit: $.creditReport,
                documents: $.docResults,
                decision: {
                  source: $.aiDecision.source,
                  model: $.aiDecision.model,
                  riskLevel: $.aiDecision.riskLevel,
                  raw: $.aiDecision.raw,
                  guardrail: $.aiDecision.guardrail,
                  error: $.aiDecision.error
                }
              }
            },
            {
              headers: {
                'Content-Type': 'application/json',
                'X-OpenFn-Secret': $.callbackSecret
              }
            }
          );

    triggers:
      webhook-loan-submit:
        type: webhook
        enabled: true
        # After deploy, copy the generated URL into OPENFN_WEBHOOK_LOAN_SUBMIT

    edges:
      webhook-loan-submit->normalize-application:
        source_trigger: webhook-loan-submit
        target_job: normalize-application
        condition_type: always
        enabled: true
      normalize-application->notify-gathering:
        condition_type: on_job_success
        source_job: normalize-application
        target_job: notify-gathering
        enabled: true
      notify-gathering->fetch-bank-and-credit:
        condition_type: on_job_success
        source_job: notify-gathering
        target_job: fetch-bank-and-credit
        enabled: true
      fetch-bank-and-credit->process-documents:
        condition_type: on_job_success
        source_job: fetch-bank-and-credit
        target_job: process-documents
        enabled: true
      process-documents->specialist-assessments:
        condition_type: on_job_success
        source_job: process-documents
        target_job: specialist-assessments
        enabled: true
      specialist-assessments->ollama-decide:
        condition_type: on_job_success
        source_job: specialist-assessments
        target_job: ollama-decide
        enabled: true
      ollama-decide->callback-gateway:
        condition_type: on_job_success
        source_job: ollama-decide
        target_job: callback-gateway
        enabled: true

  # -------------------------------------------------------------------------
  # Workflow 2: Human review continuation → Fineract write-back
  # -------------------------------------------------------------------------
  loan-review:
    name: Loan Review – Fineract Write-back
    jobs:
      prepare-review:
        name: Prepare Review Context
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          fn(state => {
            const d = state.data || {};
            console.log('prepare-review', d.workflowId, d.action);
            return {
              ...state,
              workflowId: d.workflowId,
              action: (d.action || '').toUpperCase(),
              comments: d.comments || '',
              application: d.application || {},
              summary: d.summary || {},
              gatewayBaseUrl: d.gatewayBaseUrl || 'http://host.docker.internal:8080',
              callbackSecret: d.callbackSecret || ''
            };
          });

      create-fineract-loan:
        name: Create + Approve Loan in Fineract
        adaptor: "@openfn/language-http@latest"
        credential: super@openfn.org-fineract
        enabled: true
        body: |
          // Same chain as agentic-banking-temporal FineractClient:
          // create client -> submit loan (externalId = workflowId) -> approve.
          // Uses the "fineract" credential (raw JSON):
          //   { baseUrl, username, password, tenantId, productId, officeId, tls }
          // e.g. baseUrl https://host.docker.internal:8443/fineract-provider/api/v1
          fn(async state => {
            if (state.action !== 'APPROVE') {
              return { ...state, fineractLoan: { skipped: true, reason: 'not approved' } };
            }

            const cfg = state.configuration || {};
            const app = state.application || {};
            const productId = Number(cfg.productId || 1);
            const opts = { headers: { 'Fineract-Platform-TenantId': cfg.tenantId || 'default' } };

            const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
              'August', 'September', 'October', 'November', 'December'];
            const fmt = d => `${String(d.getDate()).padStart(2, '0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
            const today = fmt(new Date());
            const disbursement = fmt(new Date(Date.now() + 7 * 24 * 60 * 60 * 1000));
            const dates = { locale: 'en', dateFormat: 'dd MMMM yyyy' };

            const names = (app.fullName || 'Unknown Applicant').trim().split(/\s+/);
            const result = { externalId: app.workflowId, productId };

            // Client externalId: the validated CURP clave when available (traceability to the
            // identity document, as in agentic-banking-temporal), otherwise <workflowId>-client
            const documents = (state.summary && state.summary.context && state.summary.context.documents) || [];
            const validCurp = documents.find(d => d.valid === true && d.extracted && d.extracted.curpClave);
            const clientExternalId = validCurp ? validCurp.extracted.curpClave : `${app.workflowId}-client`;
            result.clientExternalId = clientExternalId;

            try {
              const product = (await get(`/loanproducts/${productId}`, opts)(state)).data;
              const idOf = v => (v && typeof v === 'object' ? v.id : v);
              const clamp = (v, min, max) => Math.min(max ?? v, Math.max(min ?? v, v));
              const principal = clamp(Number(app.requestedAmount), product.minPrincipal, product.maxPrincipal);
              const repayments = clamp(Number(app.termMonths || product.numberOfRepayments),
                product.minNumberOfRepayments, product.maxNumberOfRepayments);
              const repaymentEvery = product.repaymentEvery || 1;
              const repaymentFrequencyType = idOf(product.repaymentFrequencyType) ?? 2;

              // Retries (re-review, rerun in Lightning) resume from the first missing step:
              // client and loan external ids are unique in Fineract, so reuse what exists.
              const findByExternalId = async path => {
                try {
                  return (await get(path, opts)(state)).data;
                } catch (e) {
                  if (e.statusCode === 404) return null;
                  throw e;
                }
              };

              const existingClient = await findByExternalId(`/clients/external-id/${encodeURIComponent(clientExternalId)}`);
              const clientId = existingClient ? existingClient.id : (await post('/clients', {
                officeId: Number(cfg.officeId || 1),
                firstname: names[0],
                lastname: names.slice(1).join(' ') || 'NA',
                legalFormId: 1,
                active: true,
                activationDate: today,
                externalId: clientExternalId,
                ...(app.email ? { emailAddress: app.email } : {}),
                ...(app.phone ? { mobileNo: app.phone } : {}),
                ...dates
              }, opts)(state)).data.clientId;
              result.clientId = clientId;

              const existingLoan = await findByExternalId(`/loans/external-id/${app.workflowId}`);
              const loanId = existingLoan ? existingLoan.id : (await post('/loans', {
                clientId,
                productId,
                principal,
                loanTermFrequency: repayments * repaymentEvery,
                loanTermFrequencyType: repaymentFrequencyType,
                numberOfRepayments: repayments,
                repaymentEvery,
                repaymentFrequencyType,
                interestRatePerPeriod: product.interestRatePerPeriod,
                amortizationType: idOf(product.amortizationType) ?? 1,
                interestType: idOf(product.interestType) ?? 0,
                interestCalculationPeriodType: idOf(product.interestCalculationPeriodType) ?? 1,
                transactionProcessingStrategyCode: product.transactionProcessingStrategyCode || 'mifos-standard-strategy',
                expectedDisbursementDate: disbursement,
                submittedOnDate: today,
                loanType: 'individual',
                externalId: app.workflowId,
                ...dates
              }, opts)(state)).data.loanId;
              result.loanId = loanId;
              result.principal = principal;

              const status = existingLoan?.status || {};
              if (existingLoan && !status.pendingApproval && !status.waitingForDisbursal && !status.active) {
                throw new Error(`Loan ${loanId} (externalId ${app.workflowId}) is ${status.value}, cannot approve`);
              }
              if (!existingLoan || status.pendingApproval) {
                await post(`/loans/${loanId}?command=approve`, {
                  approvedOnDate: today,
                  expectedDisbursementDate: disbursement,
                  approvedLoanAmount: principal,
                  ...dates
                }, opts)(state);
              }
              if (existingClient || existingLoan) {
                result.resumed = true;
              }

              result.status = 'APPROVED_IN_FINERACT';
              console.log('Fineract loan approved', result.loanId, 'externalId', result.externalId);

              // Underwriting decision note (independent: a failure here does not fail the write-back)
              try {
                const header = '=== Agentic underwriting decision (Ollama / OpenFn) ===';
                const marker = `Workflow ID (loan externalId): ${app.workflowId}`;
                const notes = (await get(`/loans/${loanId}/notes`, opts)(state)).data || [];
                const existing = notes.find(n => (n.note || '').includes(header) && n.note.includes(marker));
                if (existing) {
                  result.decisionNoteId = existing.id;
                } else {
                  const summary = state.summary || {};
                  const decision = (summary.context && summary.context.decision) || {};
                  const lines = [
                    header,
                    marker,
                    `Decision source: ${decision.source || 'unknown'}${decision.model ? ` (model ${decision.model})` : ''}`,
                    `AI recommendation: ${summary.recommendation}`,
                    `Confidence: ${summary.confidence}`,
                    `Risk level: ${decision.riskLevel || 'n/a'}`,
                    `Human decision: ${state.action}${state.comments ? ` – ${state.comments}` : ''}`,
                    '',
                    '--- AI summary ---',
                    summary.rationale || '(none)'
                  ];
                  if (decision.raw) {
                    lines.push('', '--- LLM raw output ---', decision.raw);
                  }
                  if (decision.guardrail) {
                    lines.push('', `--- Guardrail applied: ${decision.guardrail} ---`);
                  }
                  if (decision.error) {
                    lines.push('', `--- Ollama not used: ${decision.error} ---`);
                  }
                  if (Array.isArray(summary.assessments) && summary.assessments.length) {
                    lines.push('', '--- Assessments ---');
                    summary.assessments.forEach(a =>
                      lines.push(`- ${a.type}: ${a.verdict} score=${a.score} reason=${a.rationale}`));
                  }
                  lines.push('', '--- Product adaptation ---', `Principal submitted: ${principal}`, `Repayments: ${repayments}`);
                  const text = lines.join('\n');
                  const note = (await post(`/loans/${loanId}/notes`, {
                    note: text.length > 4000 ? `${text.slice(0, 3997)}...` : text
                  }, opts)(state)).data;
                  result.decisionNoteId = note.resourceId;
                }
                result.decisionNoteAttached = true;
              } catch (noteError) {
                result.decisionNoteAttached = false;
                result.decisionNoteError = noteError.message;
                console.error('Could not attach decision note', noteError.message, JSON.stringify(noteError.body));
              }

              // Vision model note (independent of the decision note, as in agentic-banking-temporal)
              const analysed = documents.filter(d => d.visionModel || d.extracted);
              if (analysed.length) {
                try {
                  const header = '=== Vision model document analysis (Ollama / OpenFn) ===';
                  const marker = `Workflow ID (loan externalId): ${app.workflowId}`;
                  const notes = (await get(`/loans/${loanId}/notes`, opts)(state)).data || [];
                  const existing = notes.find(n => (n.note || '').includes(header) && n.note.includes(marker));
                  if (existing) {
                    result.visionNoteId = existing.id;
                  } else {
                    const models = [...new Set(analysed.map(d => d.visionModel).filter(Boolean))];
                    const lines = [
                      header,
                      `Vision model: ${models.join(', ') || '(unknown)'}`,
                      marker,
                      `Client externalId: ${clientExternalId}`,
                      'Source: gateway PDF -> PNG, OpenFn process-documents job -> Ollama vision',
                      ''
                    ];
                    analysed.forEach((d, i) => {
                      const x = d.extracted || {};
                      lines.push(`--- Document #${i + 1} ---`, `Path: ${d.path}`, `Type: ${d.docType}`, `Overall valid: ${d.valid}`);
                      if (d.validationMessages && d.validationMessages.length) {
                        lines.push('Validation messages:', ...d.validationMessages.map(m => `  - ${m}`));
                      }
                      if (x.curpClave) lines.push(`CURP clave: ${x.curpClave}`);
                      if (x.fullName) lines.push(`Extracted name: ${x.fullName}`);
                      if (x.issueDate) lines.push(`Issue date: ${x.issueDate}`);
                      if (x.registrationEntity) lines.push(`Registration entity: ${x.registrationEntity}`);
                      if (x.confidence != null) lines.push(`Confidence: ${x.confidence}`);
                      if (d.visionRaw) lines.push('', '--- Vision model raw analysis output ---', d.visionRaw);
                      lines.push('');
                    });
                    const text = lines.join('\n');
                    const note = (await post(`/loans/${loanId}/notes`, {
                      note: text.length > 4000 ? `${text.slice(0, 3997)}...` : text
                    }, opts)(state)).data;
                    result.visionNoteId = note.resourceId;
                  }
                  result.visionNoteAttached = true;
                } catch (noteError) {
                  result.visionNoteAttached = false;
                  result.visionNoteError = noteError.message;
                  console.error('Could not attach vision note', noteError.message, JSON.stringify(noteError.body));
                }
              }
            } catch (e) {
              // Report the failure to the gateway instead of leaving the case in WRITING_TO_FINERACT
              result.status = 'FINERACT_ERROR';
              result.error = e.message;
              result.details = e.body;
              console.error('Fineract write-back failed', e.message, JSON.stringify(e.body));
            }

            return { ...state, fineractLoan: result };
          });

      callback-fineract-done:
        name: Callback Gateway – COMPLETED
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          post(
            `${$.gatewayBaseUrl}/api/openfn/callback/fineract-complete`,
            {
              workflowId: $.workflowId,
              fineractLoan: $.fineractLoan
            },
            {
              headers: {
                'Content-Type': 'application/json',
                'X-OpenFn-Secret': $.callbackSecret
              }
            }
          );

    triggers:
      webhook-loan-review:
        type: webhook
        enabled: true

    edges:
      webhook-loan-review->prepare-review:
        source_trigger: webhook-loan-review
        target_job: prepare-review
        condition_type: always
        enabled: true
      prepare-review->create-fineract-loan:
        condition_type: on_job_success
        source_job: prepare-review
        target_job: create-fineract-loan
        enabled: true
      create-fineract-loan->callback-fineract-done:
        condition_type: on_job_success
        source_job: create-fineract-loan
        target_job: callback-fineract-done
        enabled: true
