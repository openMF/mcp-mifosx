# OpenFn Lightning project specification – Agentic Loan Origination
# Deploy with: openfn deploy -p project.yaml  (or push via Lightning GitHub sync)
#
# Docs: https://docs.openfn.org/documentation/legacy/portability
name: agentic-loan-origination
description: >
  Durable multi-step loan underwriting for Mifos/Fineract.
  Replaces Temporal SupervisorWorkflow with OpenFn Lightning jobs.
  Spring Boot Agentic Gateway owns HITL + status queries; OpenFn owns step execution.

# Lightning credential used by the Fineract write-back job. It must exist before deploying:
# a raw JSON credential named "fineract", owned by the Lightning user below
# (change owner to your Lightning user's email).
credentials:
  super@openfn.org-fineract:
    name: fineract
    owner: super@openfn.org

workflows:
  # -------------------------------------------------------------------------
  # Workflow 1: Auto underwriting (triggered by gateway POST /api/loans/submit)
  # -------------------------------------------------------------------------
  loan-submit:
    name: Loan Submit – Auto Underwriting
    jobs:
      normalize-application:
        name: Normalize Application
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          // state.data is the webhook body from the Agentic Gateway
          fn(state => {
            const app = state.data || {};
            console.log('normalize-application', app.workflowId);
            return {
              ...state,
              application: {
                workflowId: app.workflowId,
                applicantId: app.applicantId,
                fullName: app.fullName,
                email: app.email,
                phone: app.phone,
                requestedAmount: Number(app.requestedAmount),
                termMonths: Number(app.termMonths || 12),
                purpose: app.purpose || 'GENERAL',
                applicationDate: app.applicationDate,
                documentPaths: app.documentPaths || [],
                metadata: app.metadata || {}
              },
              gatewayBaseUrl: app.gatewayBaseUrl || 'http://host.docker.internal:8080',
              callbackSecret: app.callbackSecret || ''
            };
          });

      notify-gathering:
        name: Notify Gateway – GATHERING_DATA
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          post(
            `${$.gatewayBaseUrl}/api/openfn/callback/status`,
            {
              workflowId: $.application.workflowId,
              phase: 'GATHERING_DATA'
            },
            {
              headers: {
                'Content-Type': 'application/json',
                'X-OpenFn-Secret': $.callbackSecret
              }
            }
          );

      fetch-bank-and-credit:
        name: Fetch Bank + Credit (parallel simulation)
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          // In production: use language-http against real bank / CIBIL / Experian APIs
          // with independent retries. Here we simulate durable data gathering.
          fn(state => {
            const amount = state.application.requestedAmount;
            const bankData = {
              provider: 'mock-bank',
              averageBalance: amount * 1.8,
              salaryCreditsLast3Months: 3,
              bouncedCheques: 0
            };
            // CIBIL → Experian fallback pattern (same idea as Temporal retry policy)
            let creditReport = {
              bureau: 'CIBIL',
              score: 720,
              accounts: 4,
              delinquencies: 0
            };
            if (creditReport.score < 0) {
              creditReport = { bureau: 'Experian', score: 705, accounts: 3, delinquencies: 0 };
            }
            console.log('bank+credit fetched for', state.application.workflowId);
            return { ...state, bankData, creditReport };
          });

      process-documents:
        name: Process Documents (OCR stub)
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          fn(state => {
            const paths = state.application.documentPaths || [];
            const docResults = paths.length
              ? paths.map(p => ({ path: p, extracted: true, type: 'ID', confidence: 0.9 }))
              : [{ path: 'stub', extracted: true, type: 'NONE', confidence: 1.0 }];
            return { ...state, docResults };
          });

      specialist-assessments:
        name: Specialist Assessments (Income / Expense / Credit)
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          fn(state => {
            const { application, bankData, creditReport } = state;
            const amount = application.requestedAmount;

            const income = {
              type: 'INCOME',
              verdict: bankData.salaryCreditsLast3Months >= 2 ? 'PASS' : 'REFER',
              score: bankData.salaryCreditsLast3Months >= 2 ? 0.85 : 0.5,
              rationale: `Salary credits last 3 months: ${bankData.salaryCreditsLast3Months}`
            };
            const expense = {
              type: 'EXPENSE',
              verdict: bankData.bouncedCheques === 0 ? 'PASS' : 'FAIL',
              score: bankData.bouncedCheques === 0 ? 0.8 : 0.3,
              rationale: `Bounced cheques: ${bankData.bouncedCheques}`
            };
            const credit = {
              type: 'CREDIT',
              verdict: creditReport.score >= 650 ? 'PASS' : creditReport.score >= 550 ? 'REFER' : 'FAIL',
              score: Math.min(1, creditReport.score / 900),
              rationale: `${creditReport.bureau} score ${creditReport.score}`
            };

            // High ticket → force REFER
            if (amount > 50000 && credit.verdict === 'PASS') {
              credit.verdict = 'REFER';
              credit.rationale += ' (high amount – human review required)';
            }

            return {
              ...state,
              assessments: [income, expense, credit]
            };
          });

      ollama-decide:
        name: Ollama Aggregate Decision
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          // Call local Ollama. If down, heuristic fallback (same as Temporal design).
          fn(state => {
            const fails = state.assessments.filter(a => a.verdict === 'FAIL').length;
            const refers = state.assessments.filter(a => a.verdict === 'REFER').length;
            let recommendation, confidence, rationale;
            if (fails > 0) {
              recommendation = 'REJECT';
              confidence = 0.8;
              rationale = 'One or more specialist assessments failed.';
            } else if (refers > 0) {
              recommendation = 'REFER';
              confidence = 0.65;
              rationale = 'Borderline assessments – human review required.';
            } else {
              recommendation = 'APPROVE';
              confidence = 0.78;
              rationale = 'All specialist assessments passed.';
            }
            return {
              ...state,
              aiDecision: { recommendation, confidence, rationale }
            };
          });
          // Optional live Ollama call (uncomment when Ollama is reachable from worker):
          // post('http://host.docker.internal:11434/api/generate', {
          //   body: {
          //     model: 'llama3.2:latest',
          //     prompt: `Return ONLY JSON {"recommendation":"APPROVE|REJECT|REFER","confidence":0-1,"rationale":"..."} for loan ${JSON.stringify($.application)} assessments ${JSON.stringify($.assessments)}`,
          //     stream: false,
          //     format: 'json'
          //   }
          // });

      callback-gateway:
        name: Callback Gateway – PENDING_HUMAN_REVIEW
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          post(
            `${$.gatewayBaseUrl}/api/openfn/callback/underwriting-complete`,
            {
              workflowId: $.application.workflowId,
              recommendation: $.aiDecision.recommendation,
              confidence: $.aiDecision.confidence,
              rationale: $.aiDecision.rationale,
              assessments: $.assessments,
              context: {
                bank: $.bankData,
                credit: $.creditReport,
                documents: $.docResults
              }
            },
            {
              headers: {
                'Content-Type': 'application/json',
                'X-OpenFn-Secret': $.callbackSecret
              }
            }
          );

    triggers:
      webhook-loan-submit:
        type: webhook
        enabled: true
        # After deploy, copy the generated URL into OPENFN_WEBHOOK_LOAN_SUBMIT

    edges:
      webhook-loan-submit->normalize-application:
        source_trigger: webhook-loan-submit
        target_job: normalize-application
        condition_type: always
        enabled: true
      normalize-application->notify-gathering:
        condition_type: on_job_success
        source_job: normalize-application
        target_job: notify-gathering
        enabled: true
      notify-gathering->fetch-bank-and-credit:
        condition_type: on_job_success
        source_job: notify-gathering
        target_job: fetch-bank-and-credit
        enabled: true
      fetch-bank-and-credit->process-documents:
        condition_type: on_job_success
        source_job: fetch-bank-and-credit
        target_job: process-documents
        enabled: true
      process-documents->specialist-assessments:
        condition_type: on_job_success
        source_job: process-documents
        target_job: specialist-assessments
        enabled: true
      specialist-assessments->ollama-decide:
        condition_type: on_job_success
        source_job: specialist-assessments
        target_job: ollama-decide
        enabled: true
      ollama-decide->callback-gateway:
        condition_type: on_job_success
        source_job: ollama-decide
        target_job: callback-gateway
        enabled: true

  # -------------------------------------------------------------------------
  # Workflow 2: Human review continuation → Fineract write-back
  # -------------------------------------------------------------------------
  loan-review:
    name: Loan Review – Fineract Write-back
    jobs:
      prepare-review:
        name: Prepare Review Context
        adaptor: "@openfn/language-common@latest"
        enabled: true
        body: |
          fn(state => {
            const d = state.data || {};
            console.log('prepare-review', d.workflowId, d.action);
            return {
              ...state,
              workflowId: d.workflowId,
              action: (d.action || '').toUpperCase(),
              comments: d.comments || '',
              application: d.application || {},
              summary: d.summary || {},
              gatewayBaseUrl: d.gatewayBaseUrl || 'http://host.docker.internal:8080',
              callbackSecret: d.callbackSecret || ''
            };
          });

      create-fineract-loan:
        name: Create + Approve Loan in Fineract
        adaptor: "@openfn/language-http@latest"
        credential: super@openfn.org-fineract
        enabled: true
        body: |
          // Same chain as agentic-banking-temporal FineractClient:
          // create client -> submit loan (externalId = workflowId) -> approve.
          // Uses the "fineract" credential (raw JSON):
          //   { baseUrl, username, password, tenantId, productId, officeId, tls }
          // e.g. baseUrl https://host.docker.internal:8443/fineract-provider/api/v1
          fn(async state => {
            if (state.action !== 'APPROVE') {
              return { ...state, fineractLoan: { skipped: true, reason: 'not approved' } };
            }

            const cfg = state.configuration || {};
            const app = state.application || {};
            const productId = Number(cfg.productId || 1);
            const opts = { headers: { 'Fineract-Platform-TenantId': cfg.tenantId || 'default' } };

            const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
              'August', 'September', 'October', 'November', 'December'];
            const fmt = d => `${String(d.getDate()).padStart(2, '0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
            const today = fmt(new Date());
            const disbursement = fmt(new Date(Date.now() + 7 * 24 * 60 * 60 * 1000));
            const dates = { locale: 'en', dateFormat: 'dd MMMM yyyy' };

            const names = (app.fullName || 'Unknown Applicant').trim().split(/\s+/);
            const result = { externalId: app.workflowId, productId };

            try {
              const product = (await get(`/loanproducts/${productId}`, opts)(state)).data;
              const idOf = v => (v && typeof v === 'object' ? v.id : v);
              const clamp = (v, min, max) => Math.min(max ?? v, Math.max(min ?? v, v));
              const principal = clamp(Number(app.requestedAmount), product.minPrincipal, product.maxPrincipal);
              const repayments = clamp(Number(app.termMonths || product.numberOfRepayments),
                product.minNumberOfRepayments, product.maxNumberOfRepayments);
              const repaymentEvery = product.repaymentEvery || 1;
              const repaymentFrequencyType = idOf(product.repaymentFrequencyType) ?? 2;

              // Retries (re-review, rerun in Lightning) resume from the first missing step:
              // client and loan external ids are unique in Fineract, so reuse what exists.
              const findByExternalId = async path => {
                try {
                  return (await get(path, opts)(state)).data;
                } catch (e) {
                  if (e.statusCode === 404) return null;
                  throw e;
                }
              };

              const existingClient = await findByExternalId(`/clients/external-id/${app.workflowId}-client`);
              const clientId = existingClient ? existingClient.id : (await post('/clients', {
                officeId: Number(cfg.officeId || 1),
                firstname: names[0],
                lastname: names.slice(1).join(' ') || 'NA',
                legalFormId: 1,
                active: true,
                activationDate: today,
                externalId: `${app.workflowId}-client`,
                ...(app.email ? { emailAddress: app.email } : {}),
                ...(app.phone ? { mobileNo: app.phone } : {}),
                ...dates
              }, opts)(state)).data.clientId;
              result.clientId = clientId;

              const existingLoan = await findByExternalId(`/loans/external-id/${app.workflowId}`);
              const loanId = existingLoan ? existingLoan.id : (await post('/loans', {
                clientId,
                productId,
                principal,
                loanTermFrequency: repayments * repaymentEvery,
                loanTermFrequencyType: repaymentFrequencyType,
                numberOfRepayments: repayments,
                repaymentEvery,
                repaymentFrequencyType,
                interestRatePerPeriod: product.interestRatePerPeriod,
                amortizationType: idOf(product.amortizationType) ?? 1,
                interestType: idOf(product.interestType) ?? 0,
                interestCalculationPeriodType: idOf(product.interestCalculationPeriodType) ?? 1,
                transactionProcessingStrategyCode: product.transactionProcessingStrategyCode || 'mifos-standard-strategy',
                expectedDisbursementDate: disbursement,
                submittedOnDate: today,
                loanType: 'individual',
                externalId: app.workflowId,
                ...dates
              }, opts)(state)).data.loanId;
              result.loanId = loanId;
              result.principal = principal;

              const status = existingLoan?.status || {};
              if (existingLoan && !status.pendingApproval && !status.waitingForDisbursal && !status.active) {
                throw new Error(`Loan ${loanId} (externalId ${app.workflowId}) is ${status.value}, cannot approve`);
              }
              if (!existingLoan || status.pendingApproval) {
                await post(`/loans/${loanId}?command=approve`, {
                  approvedOnDate: today,
                  expectedDisbursementDate: disbursement,
                  approvedLoanAmount: principal,
                  ...dates
                }, opts)(state);
              }
              if (existingClient || existingLoan) {
                result.resumed = true;
              }

              result.status = 'APPROVED_IN_FINERACT';
              console.log('Fineract loan approved', result.loanId, 'externalId', result.externalId);
            } catch (e) {
              // Report the failure to the gateway instead of leaving the case in WRITING_TO_FINERACT
              result.status = 'FINERACT_ERROR';
              result.error = e.message;
              result.details = e.body;
              console.error('Fineract write-back failed', e.message, JSON.stringify(e.body));
            }

            return { ...state, fineractLoan: result };
          });

      callback-fineract-done:
        name: Callback Gateway – COMPLETED
        adaptor: "@openfn/language-http@latest"
        enabled: true
        body: |
          post(
            `${$.gatewayBaseUrl}/api/openfn/callback/fineract-complete`,
            {
              workflowId: $.workflowId,
              fineractLoan: $.fineractLoan
            },
            {
              headers: {
                'Content-Type': 'application/json',
                'X-OpenFn-Secret': $.callbackSecret
              }
            }
          );

    triggers:
      webhook-loan-review:
        type: webhook
        enabled: true

    edges:
      webhook-loan-review->prepare-review:
        source_trigger: webhook-loan-review
        target_job: prepare-review
        condition_type: always
        enabled: true
      prepare-review->create-fineract-loan:
        condition_type: on_job_success
        source_job: prepare-review
        target_job: create-fineract-loan
        enabled: true
      create-fineract-loan->callback-fineract-done:
        condition_type: on_job_success
        source_job: create-fineract-loan
        target_job: callback-fineract-done
        enabled: true
