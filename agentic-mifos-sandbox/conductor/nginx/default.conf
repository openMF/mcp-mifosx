# Replaces the Conductor image's own site (this folder is mounted over
# /etc/nginx/http.d). One port, as Lightning has:
#   /            the UI
#   /api/        Conductor's API, read-only: Conductor OSS has no
#                authentication, so nothing here may start, change or claim work
#   /i/<name>    the entry (conductor-entry), which starts workflows for
#                callers with an API key
server {
  listen 5000;
  server_name conductor;
  server_tokens off;
  client_max_body_size 64k;

  # Docker's DNS, asked per request: nginx starts before conductor-entry exists
  resolver 127.0.0.11 valid=10s ipv6=off;

  # No path parameters: Spring matches /api/tasks;x=1/poll/<type> as
  # /api/tasks/poll/<type>, which would carry a request past the blocks below.
  # Neither the UI nor the entry uses them.
  if ($request_uri ~* "(;|%3b)") {
    return 400;
  }

  # The UI's bundle carries analytics tags (Google Tag Manager, HubSpot): only
  # this origin's scripts run, and the code editor's from jsDelivr.
  add_header Content-Security-Policy "script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'" always;
  add_header Referrer-Policy "strict-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /api/ {
    # GET (and HEAD) only: starting, retrying, terminating or deleting
    # anything takes another method
    limit_except GET {
      deny all;
    }
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
  }

  # GETs that still change something (Conductor's OpenAPI, 3.34.1): polling
  # claims a task from its queue; the scheduler's admin GETs pause, resume and
  # requeue all scheduling; admin
  location /api/tasks/poll {
    return 403;
  }
  location /api/scheduler/admin {
    return 403;
  }
  location /api/admin {
    return 403;
  }

  location /i/ {
    set $entry http://conductor-entry:8000;
    proxy_pass $entry;
    # The entry answers within its 30 s reply deadline
    proxy_read_timeout 75s;
  }
}
