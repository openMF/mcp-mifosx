# Agentic Mifos sandbox: a minimal, self-contained Mifos X environment for
# agentic workflows. This file starts the system of record (Apache Fineract),
# the Mifos X web app and the OpenFn Lightning orchestrator, plus the Pi agents
# and their scoped MCP servers on request.
#
#   ./scripts/gen-secrets.sh   # creates .env with generated passwords and keys
#   docker compose up -d
#   open http://localhost:4200   Mifos X web app (mifos / FINERACT_ADMIN_PASSWORD in .env)
#   open http://localhost:4000   OpenFn Lightning (LIGHTNING_ADMIN_* in .env)
#   curl http://localhost:8080/actuator/health   Agentic gateway (loan API)
#   open http://localhost:8090/docs   LOS: commercial opportunities (los/README.md)
#
# Local models (optional, several GB to download on first start):
#   docker compose --profile ollama up -d
# Without the profile the OpenFn jobs fall back to rule-based decisions, or
# set OLLAMA_URL in .env to an Ollama server you already run.
#
# Agents (Pi, see pi-agent/) start with the local models (`--profile ollama`):
# the loan flow's decision step asks agent-decision through its HTTP runner,
# and falls back to rule-based decisions without it. One-off runs:
#   docker compose --profile ollama run --rm agent-decision \
#     -p "List the loan products with their interest rates"
# From a script, add -T and close stdin (`< /dev/null`): without a terminal,
# Pi reads stdin into the prompt and waits for it to end.
#
# Hardening: every service runs with a read-only file system (writable paths
# are tmpfs or volumes), no Linux capabilities, no privilege escalation, an
# explicit non-root user and memory and process limits. The only exceptions are
# the two one-shot jobs that hand a volume to an unprivileged user: they run as
# root with only the capabilities that needs, and no network.
# scripts/check-hardening.py checks all of this in CI.
#
# Networks. Internal ones have no route outside Docker; each of the others
# carries one published port (bound to 127.0.0.1) or one service's downloads.
#   fineract-db  - internal: Fineract and its database
#   core         - internal: Fineract's API and its clients (web app, worker,
#                  bootstrap, MCP servers)
#   lightning-db - internal: Lightning and its database
#   openfn       - internal: Lightning, its worker, the bootstrap and the gateway
#   llm          - internal: Ollama for the OpenFn worker
#   agents-llm   - internal: Ollama for the agents
#   agent-<name> - internal: one agent and its MCP server
#   openfn-agents - internal: the OpenFn worker and the agents' runners
#   los          - internal: the LOS and its database (no route to Fineract)
#   web-app-edge, lightning-edge, gateway-edge, los-edge - one published port each
#                  (lightning-edge also for the npm adaptor catalogue)
#   worker-egress - the OpenFn worker, to install adaptors from npm
#   llm-egress   - Ollama, to download models

# Webhook trigger ids of the OpenFn project. The bootstrap provisions the
# triggers with exactly these ids, so the gateway's webhook URLs are fixed.
x-openfn-triggers:
  loan-submit: &trigger-loan-submit 8c5f206e-6510-4bc1-87cd-cd71554e9335
  loan-review: &trigger-loan-review bde8f76a-5f61-4183-ac6f-0ec0ce8d9ff4

# Settings every service gets (see Hardening above).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

# Postgres runs as its own user from the start, so the entrypoint needs no root
# step; the socket and lock file live in /run/postgresql.
x-postgres: &postgres
  <<: *hardened
  user: postgres
  tmpfs: ["/run/postgresql:uid=70,gid=70,mode=0775,size=1m", "/tmp:size=16m"]
  pids_limit: 512

# Models: the decision agent's (text) and the identity document job's
# (vision). ollama-pull downloads both.
x-ollama:
  model: &ollama-model ${OLLAMA_MODEL:-llama3.2:3b}
  vision-model: &ollama-vision-model ${OLLAMA_VISION_MODEL:-qwen2.5vl:3b}

services:
  fineract-db:
    <<: *postgres
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      # Superuser, used only by the init script; Fineract never sees it.
      POSTGRES_PASSWORD: ${FINERACT_DB_ADMIN_PASSWORD:?set FINERACT_DB_ADMIN_PASSWORD in .env}
      FINERACT_APP_DB_USER: fineract
      FINERACT_APP_DB_PASSWORD: ${FINERACT_DB_APP_PASSWORD:?set FINERACT_DB_APP_PASSWORD in .env}
    volumes:
      - ./fineract/postgresql-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - fineract-db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the init script runs on first start, Postgres listens on
      # its Unix socket only, so this passes once Fineract's database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d fineract_tenants"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [fineract-db]
    mem_limit: 768m
    restart: unless-stopped

  fineract:
    <<: *hardened
    # Pinned by digest (same build as the web app's e2e suite): apache/fineract
    # publishes several tags a day and `latest` moves under you.
    image: ${FINERACT_IMAGE:-apache/fineract:7ac780192@sha256:c3722d8475e140949b6bbec505833f0b5e5a6c27f8f8bd8d2ac38ff7df20fa05}
    depends_on:
      fineract-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test,diagnostics
      FINERACT_NODE_ID: 1
      FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME: org.postgresql.Driver
      FINERACT_HIKARI_JDBC_URL: jdbc:postgresql://fineract-db:5432/fineract_tenants
      # Dedicated non-superuser role created by fineract/postgresql-init.sh.
      FINERACT_HIKARI_USERNAME: fineract
      FINERACT_HIKARI_PASSWORD: ${FINERACT_DB_APP_PASSWORD}
      FINERACT_HIKARI_MINIMUM_IDLE: 3
      FINERACT_HIKARI_MAXIMUM_POOL_SIZE: 10
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: fineract-db
      FINERACT_DEFAULT_TENANTDB_PORT: 5432
      FINERACT_DEFAULT_TENANTDB_UID: fineract
      FINERACT_DEFAULT_TENANTDB_PWD: ${FINERACT_DB_APP_PASSWORD}
      FINERACT_DEFAULT_TENANTDB_NAME: fineract_default
      FINERACT_DEFAULT_TENANTDB_TIMEZONE: ${FINERACT_TIMEZONE:-UTC}
      FINERACT_SERVER_SSL_ENABLED: "true"
      FINERACT_INSECURE_HTTP_CLIENT: "true"
      FINERACT_EXTERNAL_EVENTS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: >-
        -Xmx1536m -Xms512m
        -XX:+UseG1GC -XX:MaxGCPauseMillis=200
        -Djava.security.egd=file:/dev/./urandom
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost:8443/fineract-provider/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s
    user: nobody
    # The health check's wget leaves an ssl_client process behind, and Java as
    # PID 1 never reaps it: the zombies filled pids_limit after about 16 hours.
    # Docker's init reaps them.
    init: true
    tmpfs: ["/tmp:size=128m"]
    networks: [fineract-db, core]
    mem_limit: 2g
    pids_limit: 1024
    restart: unless-stopped

  web-app:
    <<: *hardened
    image: ${WEBAPP_IMAGE:-openmf/web-app:1.14}
    depends_on:
      fineract:
        condition: service_healthy
    environment:
      FINERACT_PROXY_TARGET: https://fineract:8443
      # Empty URLs make the app call its own origin; nginx proxies to Fineract.
      FINERACT_API_URLS: ""
      FINERACT_API_URL: ""
      FINERACT_API_PROVIDER: /fineract-provider/api
      FINERACT_API_VERSION: /v1
      FINERACT_PLATFORM_TENANT_IDENTIFIER: default
      # The sandbox has exactly one backend; hide the server picker.
      MIFOS_ALLOW_SERVER_SWITCH_SELECTOR: "false"
      MIFOS_DEFAULT_LANGUAGE: en-US
      MIFOS_PRELOAD_CLIENTS: "true"
      MIFOS_DEFAULT_CHAR_DELIMITER: ","
    volumes:
      - ./web-app/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    # The image's own CMD renders env.js only; render the proxy config too.
    # Only $FINERACT_PROXY_TARGET is substituted so nginx variables survive.
    # env.js goes to /run (the image is read-only); nginx serves it as
    # /assets/env.js.
    command: >-
      /bin/sh -c "
      envsubst '$$FINERACT_PROXY_TARGET' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf &&
      envsubst < /usr/share/nginx/html/assets/env.template.js > /run/env.js &&
      exec nginx -g 'daemon off;'
      "
    # The image's nginx user (uid 101), listening on 8080.
    user: nginx
    tmpfs:
      - /run:uid=101,gid=101,size=1m
      - /var/cache/nginx:uid=101,gid=101,size=16m
      - /etc/nginx/conf.d:uid=101,gid=101,size=1m
    ports:
      - "127.0.0.1:${WEBAPP_PORT:-4200}:8080"
    networks: [web-app-edge, core]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  lightning-db:
    <<: *postgres
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      # Superuser, used only by the init script; Lightning never sees it.
      POSTGRES_PASSWORD: ${LIGHTNING_DB_ADMIN_PASSWORD:?set LIGHTNING_DB_ADMIN_PASSWORD in .env}
      LIGHTNING_APP_DB_USER: lightning
      LIGHTNING_APP_DB_PASSWORD: ${LIGHTNING_DB_APP_PASSWORD:?set LIGHTNING_DB_APP_PASSWORD in .env}
    volumes:
      - ./lightning/postgresql-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - lightning-db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP, as for fineract-db: passes once Lightning's database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d lightning"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [lightning-db]
    mem_limit: 512m
    restart: unless-stopped

  # Hands the shared bootstrap-state volume to uid 1000 (the Lightning and
  # bootstrap images), so neither needs to run as root. FOWNER: on later runs
  # the folder already belongs to 1000, and root needs it to chmod.
  state-init:
    <<: *hardened
    image: busybox:1.38
    command: ["sh", "-c", "chown 1000:1000 /state && chmod 700 /state"]
    user: root
    cap_add: [CHOWN, FOWNER]
    volumes:
      - bootstrap-state:/state
    network_mode: none
    mem_limit: 32m
    pids_limit: 32
    restart: "no"

  # Shared settings for the Lightning server and its one-shot setup job.
  lightning-setup: &lightning
    <<: *hardened
    image: ${LIGHTNING_IMAGE:-openfn/lightning:v2.19.2}
    depends_on:
      lightning-db:
        condition: service_healthy
      state-init:
        condition: service_completed_successfully
    environment: &lightning-env
      # Dedicated non-superuser role created by lightning/postgresql-init.sh.
      DATABASE_URL: ecto://lightning:${LIGHTNING_DB_APP_PASSWORD}@lightning-db:5432/lightning
      # The database is only reachable on the internal openfn network.
      DISABLE_DB_SSL: "true"
      SECRET_KEY_BASE: ${LIGHTNING_SECRET_KEY_BASE:?run scripts/gen-secrets.sh}
      PRIMARY_ENCRYPTION_KEY: ${LIGHTNING_PRIMARY_ENCRYPTION_KEY:?run scripts/gen-secrets.sh}
      WORKER_RUNS_PRIVATE_KEY: ${LIGHTNING_WORKER_RUNS_PRIVATE_KEY:?run scripts/gen-secrets.sh}
      WORKER_SECRET: ${LIGHTNING_WORKER_SECRET:?run scripts/gen-secrets.sh}
      LISTEN_ADDRESS: 0.0.0.0
      PORT: 4000
      URL_SCHEME: http
      URL_HOST: localhost
      URL_PORT: ${LIGHTNING_PORT:-4000}
      # Must be set: when unset, Lightning v2.19 passes nil to Phoenix and every
      # websocket (the UI and the worker) fails with an ArgumentError.
      ORIGINS: http://localhost:${LIGHTNING_PORT:-4000}
      ALLOW_SIGNUP: "false"
      LIGHTNING_ADMIN_EMAIL: ${LIGHTNING_ADMIN_EMAIL:?set LIGHTNING_ADMIN_EMAIL in .env}
      LIGHTNING_ADMIN_PASSWORD: ${LIGHTNING_ADMIN_PASSWORD:?run scripts/gen-secrets.sh}
      # Keeps Lightning's writes out of its read-only release folder: Mnesia
      # (rate limiter) and crash dumps go to /tmp, and the time zone data stays
      # the one shipped with the release instead of updating itself in place.
      ERL_FLAGS: -mnesia dir '"/tmp/mnesia"' -tzdata autoupdate disabled
      ERL_CRASH_DUMP: /tmp/erl_crash.dump
      # Longest run before Lightning counts it as lost; the worker uses the
      # same limit. A run with the vision step and the decision agent needs
      # more than the default 300 s on CPU.
      WORKER_MAX_RUN_DURATION_SECONDS: &max-run-seconds 600
    # Runs the migrations, creates the admin user if it does not exist yet, and
    # writes an API token for the bootstrap to /state (kept while it stays
    # valid). Safe to run on every `up`.
    command:
      - /app/bin/lightning
      - eval
      - |
        # `eval` does not start Lightning's applications. Since v2.19.2 the
        # setup also starts the adaptor scheduler, which needs the time zone
        # database: without it every run after the first crashes.
        {:ok, _} = Application.ensure_all_started(:tzdata)
        Lightning.Release.migrate()
        email = System.fetch_env!("LIGHTNING_ADMIN_EMAIL")
        {:ok, _, _} =
          Lightning.Setup.with_minimum_setup(fn ->
            case Lightning.Accounts.get_user_by_email(email) do
              nil ->
                {:ok, _} =
                  Lightning.SetupUtils.setup_user(%{
                    role: :superuser,
                    email: email,
                    first_name: "Sandbox",
                    last_name: "Admin",
                    password: System.fetch_env!("LIGHTNING_ADMIN_PASSWORD")
                  })
                IO.puts("Created Lightning admin #{email}")
              _user ->
                IO.puts("Lightning admin #{email} already exists")
            end

            token_file = "/state/lightning-api-token"
            current = if File.exists?(token_file), do: String.trim(File.read!(token_file))

            if is_nil(current) or is_nil(Lightning.Accounts.get_user_by_api_token(current)) do
              user = Lightning.Accounts.get_user_by_email(email)
              File.write!(token_file, Lightning.Accounts.generate_api_token(user))
              File.chmod!(token_file, 0o600)
              IO.puts("Wrote a Lightning API token for the bootstrap")
            end
          end)
    volumes:
      - bootstrap-state:/state
    user: lightning
    # HOME is /app: npm's cache, and the adaptor icons Lightning downloads.
    tmpfs:
      - /tmp:size=64m
      - /app/.npm:uid=1000,gid=1000,size=32m
      - /app/priv/adaptor_icons:uid=1000,gid=1000,size=8m
    # lightning-edge: the adaptor catalogue is fetched from npm.
    networks: [lightning-db, lightning-edge]
    mem_limit: 1g
    pids_limit: 512
    restart: "no"

  lightning:
    <<: *lightning
    depends_on:
      lightning-setup:
        condition: service_completed_successfully
    environment:
      <<: *lightning-env
      LIGHTNING_ADMIN_EMAIL: ""
      LIGHTNING_ADMIN_PASSWORD: ""
    command: ["/app/bin/server"]
    volumes: []
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health_check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "127.0.0.1:${LIGHTNING_PORT:-4000}:4000"
    networks: [lightning-db, openfn, lightning-edge]
    mem_limit: 1536m
    restart: unless-stopped

  lightning-worker:
    <<: *hardened
    image: ${LIGHTNING_WORKER_IMAGE:-openfn/ws-worker:v1.29.5}
    depends_on:
      lightning:
        condition: service_healthy
    environment:
      WORKER_LIGHTNING_SERVICE_URL: ws://lightning:4000/worker
      WORKER_SECRET: ${LIGHTNING_WORKER_SECRET}
      WORKER_LIGHTNING_PUBLIC_KEY: ${LIGHTNING_WORKER_PUBLIC_KEY:?run scripts/gen-secrets.sh}
      WORKER_CAPACITY: ${LIGHTNING_WORKER_CAPACITY:-2}
      WORKER_MAX_RUN_DURATION_SECONDS: *max-run-seconds
      NODE_OPTIONS: --dns-result-order=ipv4first
      # The watchdog below listens for the claim attempts an idle worker logs
      # at debug level, every few seconds.
      WORKER_LOG_LEVEL: debug
      # Longer than any run may take (WORKER_MAX_RUN_DURATION_SECONDS).
      WORKER_WATCHDOG_SECONDS: ${LIGHTNING_WORKER_WATCHDOG_SECONDS:-900}
    # Watchdog for a ws-worker bug (still in 1.30.0): a claim sent just before
    # the socket drops is never answered and keeps a capacity slot, so after
    # the reconnect the worker believes it is full and never claims again,
    # while staying alive. A working worker logs every few seconds when idle
    # and ends every run within WORKER_MAX_RUN_DURATION_SECONDS, so silence
    # for WORKER_WATCHDOG_SECONDS means it is stuck: stop it and exit, and the
    # restart policy starts a fresh one.
    command:
      - sh
      - -c
      - |
        fifo=/tmp/worker.log
        rm -f "$$fifo" && mkfifo "$$fifo"
        node ./dist/start.js > "$$fifo" 2>&1 &
        pid=$$!
        # The read end stays open on fd 3: reopening a FIFO blocks once the
        # worker, its only writer, has exited.
        exec 3< "$$fifo"
        # docker stop: stop the worker, keep its last lines, exit with its code
        trap 'kill -TERM "$$pid" 2>/dev/null; cat <&3; wait "$$pid"; exit $$?' TERM INT
        while IFS= read -r -t "$$WORKER_WATCHDOG_SECONDS" line <&3; do
          printf '%s\n' "$$line"
        done
        # read fails at the end of the output (the worker exited, and the shell
        # has reaped it) and on the timeout (the worker is still running).
        if kill -0 "$$pid" 2>/dev/null; then
          echo "watchdog: no output from the worker for $$WORKER_WATCHDOG_SECONDS s, restarting it"
          kill -TERM "$$pid"
          (sleep 10; kill -KILL "$$pid" 2>/dev/null) &
          wait "$$pid"
          exit 1
        fi
        wait "$$pid"
    # Reaps the processes the shell above does not wait for.
    init: true
    user: node
    tmpfs: ["/tmp:size=64m"]
    # The adaptors the worker installs at run time (~70 MB): on disk rather
    # than in memory, and kept across restarts.
    volumes:
      - lightning-worker-home:/home/node
    # worker-egress: adaptors are installed from npm at run time.
    # core: the Fineract write-back job calls Fineract directly.
    # llm: the document job calls Ollama.
    # openfn-agents: the decision job calls agent-decision.
    networks: [openfn, worker-egress, core, llm, openfn-agents]
    # Lets OLLAMA_URL point at an Ollama server on the Docker host (Linux;
    # Docker Desktop provides this name already).
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 1g
    pids_limit: 512
    restart: unless-stopped

  bootstrap:
    <<: *hardened
    build: ./bootstrap
    depends_on:
      fineract:
        condition: service_healthy
      lightning:
        condition: service_healthy
    environment:
      FINERACT_URL: https://fineract:8443/fineract-provider/api/v1
      FINERACT_USERNAME: ${FINERACT_USERNAME:-mifos}
      FINERACT_PASSWORD: ${FINERACT_ADMIN_PASSWORD:?run scripts/gen-secrets.sh}
      # The image's default, tried only to change it to FINERACT_ADMIN_PASSWORD.
      FINERACT_DEFAULT_PASSWORD: password
      FINERACT_TENANT: default
      LIGHTNING_URL: http://lightning:4000
      LIGHTNING_ADMIN_EMAIL: ${LIGHTNING_ADMIN_EMAIL}
      LIGHTNING_API_TOKEN_FILE: /state/lightning-api-token
      OPENFN_PROJECT_SPEC: /spec/openfn/project.yaml
      OPENFN_TRIGGER_LOAN_SUBMIT: *trigger-loan-submit
      OPENFN_TRIGGER_LOAN_REVIEW: *trigger-loan-review
      # Agent service users and their roles (fineract-rbac.json).
      FINERACT_AGENT_RBAC: /spec/fineract-rbac.json
      FINERACT_AGENT_IDENTITY_PASSWORD: ${FINERACT_AGENT_IDENTITY_PASSWORD:?run scripts/gen-secrets.sh}
      FINERACT_AGENT_DECISION_PASSWORD: ${FINERACT_AGENT_DECISION_PASSWORD:?run scripts/gen-secrets.sh}
      FINERACT_AGENT_WRITEBACK_PASSWORD: ${FINERACT_AGENT_WRITEBACK_PASSWORD:?run scripts/gen-secrets.sh}
      FINERACT_AGENT_INTAKE_PASSWORD: ${FINERACT_AGENT_INTAKE_PASSWORD:?run scripts/gen-secrets.sh}
      # Lightning credential "agent-decision" (URL and token of its runner),
      # used by the decision job.
      AGENT_DECISION_URL: http://agent-decision:8080
      AGENT_DECISION_TOKEN: ${AGENT_DECISION_TOKEN:?run scripts/gen-secrets.sh}
    volumes:
      - bootstrap-state:/state:ro
      # The folder, not the file: Docker Desktop cannot start a container
      # again once a file mounted on its own was replaced (git pull does).
      - ../agentic-banking-openfn/openfn:/spec/openfn:ro
      - ./fineract-rbac.json:/spec/fineract-rbac.json:ro
    user: "1000:1000"
    networks: [core, openfn]
    mem_limit: 128m
    pids_limit: 128
    restart: "no"

  # Makes both webhook triggers require the gateway's API key (x-api-key).
  # Lightning has no API for a trigger's auth, so this runs Lightning's own
  # code, as lightning-setup does, once the bootstrap has provisioned the
  # triggers. Safe to run on every `up`: a key changed in .env replaces the
  # stored one, and it fails unless both triggers end up with exactly this
  # key, so a Lightning upgrade that changes these functions shows here.
  lightning-webhook-auth:
    <<: *lightning
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      <<: *lightning-env
      LIGHTNING_ADMIN_PASSWORD: ""
      OPENFN_WEBHOOK_API_KEY: ${OPENFN_WEBHOOK_API_KEY:?run scripts/gen-secrets.sh}
      OPENFN_TRIGGER_LOAN_SUBMIT: *trigger-loan-submit
      OPENFN_TRIGGER_LOAN_REVIEW: *trigger-loan-review
    command:
      - /app/bin/lightning
      - eval
      - |
        {:ok, _} = Application.ensure_all_started(:tzdata)
        alias Lightning.{Repo, WebhookAuthMethods}
        alias Lightning.Workflows.Trigger
        key = System.fetch_env!("OPENFN_WEBHOOK_API_KEY")
        trigger_ids = Enum.map(~w(OPENFN_TRIGGER_LOAN_SUBMIT OPENFN_TRIGGER_LOAN_REVIEW), &System.fetch_env!/1)
        {:ok, _, _} =
          Lightning.Setup.with_minimum_setup(fn ->
            actor = Lightning.Accounts.get_user_by_email(System.fetch_env!("LIGHTNING_ADMIN_EMAIL"))
            triggers = Enum.map(trigger_ids, &(Repo.get!(Trigger, &1) |> Repo.preload(workflow: :project)))
            project = hd(triggers).workflow.project
            # One transaction: a failure keeps the key and links as they were.
            {:ok, _} =
              Repo.transaction(fn ->
                existing = Enum.find(WebhookAuthMethods.list_for_project(project), &(&1.name == "gateway"))
                method =
                  if existing && existing.auth_type == :api && existing.api_key == key do
                    IO.puts("Webhook API key unchanged")
                    existing
                  else
                    # A method's key cannot be updated, and its name is unique
                    # in the project: replace it.
                    if existing, do: {:ok, _} = WebhookAuthMethods.delete_auth_method(existing)
                    {:ok, method} =
                      WebhookAuthMethods.create_auth_method(
                        %{"name" => "gateway", "auth_type" => "api", "api_key" => key, "project_id" => project.id},
                        actor: actor
                      )
                    IO.puts(if existing, do: "Replaced the webhook API key", else: "Created the webhook API key")
                    method
                  end
                for trigger <- triggers do
                  linked = Enum.map(WebhookAuthMethods.list_for_trigger(trigger), & &1.id)
                  if linked != [method.id] do
                    {:ok, _} = WebhookAuthMethods.update_trigger_auth_methods(trigger, [method], actor: actor)
                  end
                  linked = Enum.map(WebhookAuthMethods.list_for_trigger(trigger), & &1.id)
                  linked == [method.id] ||
                    raise "trigger #{trigger.id}: auth methods #{inspect(linked)}, expected only the gateway's"
                end
              end)
            IO.puts("Both webhook triggers require the gateway's API key")
          end)
    volumes: []
    networks: [lightning-db]

  # Hands the model volume to the unprivileged user Ollama runs as. Quick on
  # every start (it changes ownership only), and converts a volume created
  # when Ollama still ran as root.
  ollama-init:
    <<: *hardened
    image: busybox:1.38
    profiles: [ollama]
    command: ["chown", "-R", "10002:10002", "/data"]
    user: root
    cap_add: [CHOWN]
    volumes:
      - ollama-data:/data
    network_mode: none
    mem_limit: 32m
    pids_limit: 32
    restart: "no"

  # Local LLM server, started only with `--profile ollama`.
  ollama:
    <<: *hardened
    image: &ollama-image ${OLLAMA_IMAGE:-ollama/ollama:0.40.5}
    profiles: [ollama]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    environment:
      # The text and vision models take turns in memory instead of both
      # staying loaded; one request at a time keeps CPU-only hosts usable.
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 10m
      # Models and keys in $HOME/.ollama: the volume below.
      HOME: /home/ollama
    user: "10002:10002"
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - ollama-data:/home/ollama/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [llm, agents-llm, llm-egress]
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    pids_limit: 512
    restart: unless-stopped

  # Downloads the models into the ollama-data volume. Models already there are
  # only checked for updates, so it is safe to run on every `up`.
  ollama-pull:
    <<: *hardened
    image: *ollama-image
    profiles: [ollama]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: *ollama-model
      OLLAMA_VISION_MODEL: *ollama-vision-model
      # The client keeps its key in $HOME/.ollama.
      HOME: /tmp
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$OLLAMA_MODEL" && ollama pull "$$OLLAMA_VISION_MODEL"']
    user: "10002:10002"
    tmpfs: ["/tmp:size=16m"]
    networks: [llm]
    mem_limit: 128m
    pids_limit: 128
    restart: "no"

  gateway:
    <<: *hardened
    build: ../agentic-banking-openfn
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      # The webhook triggers accept only the API key the gateway sends.
      lightning-webhook-auth:
        condition: service_completed_successfully
      # Only with `--profile ollama`: wait until the models are present.
      ollama-pull:
        condition: service_completed_successfully
        required: false
    environment:
      # Spring resolves the ${...} placeholders below from these two variables.
      OPENFN_TRIGGER_LOAN_SUBMIT: *trigger-loan-submit
      OPENFN_TRIGGER_LOAN_REVIEW: *trigger-loan-review
      OPENFN_WEBHOOK_LOAN_SUBMIT: http://lightning:4000/i/$${OPENFN_TRIGGER_LOAN_SUBMIT}
      OPENFN_WEBHOOK_LOAN_REVIEW: http://lightning:4000/i/$${OPENFN_TRIGGER_LOAN_REVIEW}
      # Sent as x-api-key: lightning-webhook-auth makes the triggers require it.
      OPENFN_WEBHOOK_API_KEY: ${OPENFN_WEBHOOK_API_KEY:?run scripts/gen-secrets.sh}
      OPENFN_BASE_URL: http://lightning:4000
      # Where OpenFn jobs (run by the worker) call back into the gateway.
      OPENFN_GATEWAY_BASE_URL: http://gateway:8080
      OPENFN_CALLBACK_SECRET: ${OPENFN_CALLBACK_SECRET:?run scripts/gen-secrets.sh}
      # Passed to the OpenFn jobs: the document job calls Ollama from the
      # worker. Without the ollama profile neither Ollama nor agent-decision
      # runs, and the decision job falls back to its rule-based decision.
      OPENFN_OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: *ollama-model
      OLLAMA_VISION_MODEL: *ollama-vision-model
      # Surface OpenFn failures instead of underwriting inside the gateway.
      LOAN_LOCAL_FALLBACK: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    user: gateway
    tmpfs: ["/tmp:size=64m"]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    networks: [gateway-edge, openfn]
    mem_limit: 768m
    pids_limit: 512
    restart: unless-stopped

  # Loan origination service (LOS): commercial opportunities, from first
  # contact until they are registered in Fineract or discarded. It has its own
  # database and no access to Fineract: the write-back agent registers a
  # qualified opportunity there and records the Fineract ids in the LOS.
  los-db:
    <<: *postgres
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      # Superuser, used only by the init script; the LOS never sees it.
      POSTGRES_PASSWORD: ${LOS_DB_ADMIN_PASSWORD:?run scripts/gen-secrets.sh}
      LOS_APP_DB_USER: los
      LOS_APP_DB_PASSWORD: ${LOS_DB_APP_PASSWORD:?run scripts/gen-secrets.sh}
    volumes:
      - ./los/postgresql-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - los-db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the init script runs on first start, Postgres listens on
      # its Unix socket only, so this passes once the los database exists.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d los"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [los]
    mem_limit: 256m
    restart: unless-stopped

  los:
    <<: *hardened
    build: ./los
    depends_on:
      los-db:
        condition: service_healthy
    environment:
      LOS_DB_HOST: los-db
      LOS_DB_NAME: los
      # Non-superuser role created by los/postgresql-init.sh.
      LOS_DB_USER: los
      LOS_DB_PASSWORD: ${LOS_DB_APP_PASSWORD}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    user: los
    tmpfs: ["/tmp:size=16m"]
    ports:
      - "127.0.0.1:${LOS_PORT:-8090}:8000"
    # los-edge: only for the published port; no other service is on it.
    networks: [los, los-edge]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  # Each agent is a Pi container paired with its own MCP server: the
  # mcp-mifosx Python server, limited to the agent's tool profile
  # (python/profiles.toml) and signed in to Fineract as the agent's service
  # user (fineract-rbac.json). The agent holds no Fineract credentials and
  # reaches only its MCP server and the LLM.
  mcp-decision:
    <<: *hardened
    build: ../python
    profiles: [ollama, agents]
    depends_on:
      # Creates the agent-decision user and its role.
      bootstrap:
        condition: service_completed_successfully
    environment:
      MIFOSX_BASE_URL: https://fineract:8443/fineract-provider/api/v1
      MIFOSX_TENANT_ID: default
      MIFOSX_USERNAME: agent-decision
      MIFOSX_PASSWORD: ${FINERACT_AGENT_DECISION_PASSWORD:?run scripts/gen-secrets.sh}
      # The sandbox Fineract uses a self-signed certificate.
      MIFOSX_SKIP_TLS_VERIFY: "true"
      MCP_AGENT_PROFILE: decision
      # FastMCP settings: streamable HTTP on :8000/mcp instead of stdio.
      FASTMCP_TRANSPORT: http
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
      FASTMCP_SHOW_SERVER_BANNER: "false"
      FASTMCP_CHECK_FOR_UPDATES: "off"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    # The Python image has no unprivileged user of its own.
    user: "10001:10001"
    tmpfs: ["/tmp:size=16m"]
    networks: [core, agent-decision]
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped

  # Serves the loan flow's decision step (pi-agent/skills/decision.md): looks
  # the applicant up in Fineract and recommends; the OpenFn job keeps the rules
  # and the guardrail.
  agent-decision:
    <<: *hardened
    build: ./pi-agent
    profiles: [ollama, agents]
    command: ["serve"]
    depends_on:
      mcp-decision:
        condition: service_healthy
      # Only with `--profile ollama`: wait until the models are present.
      ollama-pull:
        condition: service_completed_successfully
        required: false
    environment:
      AGENT_MCP_URL: http://mcp-decision:8000/mcp
      # The sandbox's Ollama: the agent networks have no route out, so an
      # OLLAMA_URL outside the sandbox is not reachable from here.
      AGENT_LLM_URL: http://ollama:11434/v1
      AGENT_MODEL: *ollama-model
      AGENT_SKILL: /opt/pi-agent/skills/decision.md
      AGENT_RUNNER_TOKEN: ${AGENT_DECISION_TOKEN:?run scripts/gen-secrets.sh}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    # Forwards signals to Pi and reaps its child processes.
    init: true
    user: node
    # Pi's configuration (written for each case) in /home/node/.pi.
    tmpfs: ["/tmp:size=32m", "/home/node/.pi:uid=1000,gid=1000,size=8m"]
    # openfn-agents: the decision job reaches the runner here.
    networks: [agent-decision, agents-llm, openfn-agents]
    mem_limit: 512m
    pids_limit: 256
    restart: unless-stopped

networks:
  fineract-db:
    internal: true
  core:
    internal: true
  lightning-db:
    internal: true
  openfn:
    internal: true
  llm:
    internal: true
  agents-llm:
    internal: true
  agent-decision:
    internal: true
  openfn-agents:
    internal: true
  los:
    internal: true
  web-app-edge: {}
  lightning-edge: {}
  gateway-edge: {}
  los-edge: {}
  worker-egress: {}
  llm-egress: {}

volumes:
  fineract-db-data: {}
  lightning-db-data: {}
  bootstrap-state: {}
  ollama-data: {}
  los-db-data: {}
  lightning-worker-home: {}
