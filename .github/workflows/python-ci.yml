name: Python CI

on:
  push:
    branches: ['main']
    paths:
      - 'python/**'
      - 'agent-skill/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'python/**'
      - 'agent-skill/**'
      - '.github/workflows/python-ci.yml'

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit

      - name: Lint with ruff
        run: ruff check .

      - name: Security scan with bandit
        run: bandit -r tools/ -ll -q --skip B501

      - name: Test with pytest
        run: pytest tests/ -v

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build only: catches a base image or dependency update that breaks the image.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: python
          file: python/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  agent-skill-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-skill/mifos-agent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

  agent-skill-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema ruff
          pip install ./agent-skill/mifos-agent

      - name: Lint skill scripts and tests
        run: ruff check agent-skill/mifos-x-ai-agent-*/ agent-skill/tests/

      - name: Test skills
        run: pytest agent-skill/tests/ -v
