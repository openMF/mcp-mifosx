name: Python CI

on:
  push:
    branches: ['main']
    paths:
      - 'python/**'
      - 'agent-skill/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'python/**'
      - 'agent-skill/**'
      - '.github/workflows/python-ci.yml'

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff bandit

      - name: Lint with ruff
        run: ruff check .

      - name: Security scan with bandit
        run: bandit -r tools/ -ll -q --skip B501,B113

      - name: Test with pytest
        run: pytest tests/ -v

  agent-skill-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-skill/mifos-agent

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint with ruff
        run: ruff check .

