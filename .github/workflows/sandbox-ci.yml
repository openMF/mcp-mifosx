name: Sandbox CI

on:
  push:
    branches: ['main']
    paths:
      - 'agentic-mifos-sandbox/**'
      - 'agentic-banking-openfn/openfn/project.yaml'
      - '.github/workflows/sandbox-ci.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'agentic-mifos-sandbox/**'
      - 'agentic-banking-openfn/openfn/project.yaml'
      - '.github/workflows/sandbox-ci.yml'

permissions:
  contents: read

jobs:
  hardening:
    name: Compose hardening
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-mifos-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The compose file requires its secrets: generate throwaway ones.
      - name: Generate a throwaway .env
        run: ./scripts/gen-secrets.sh

      - name: Check the hardening baseline
        run: |
          docker compose --profile ollama --profile agents config --format json > "$RUNNER_TEMP/compose.json"
          python3 scripts/check-hardening.py < "$RUNNER_TEMP/compose.json"

  adaptors:
    name: OpenFn adaptors pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every job's adaptor must be an exact version (@latest, a range or no
      # version installs whatever npm serves), written in the form
      # renovate.json updates. yq reads the values themselves, so a comment
      # on the line cannot hide one.
      - name: Check the adaptor versions
        run: |
          spec=agentic-banking-openfn/openfn/project.yaml
          adaptors=$(yq '.workflows[].jobs[].adaptor' "$spec")
          jobs=$(grep -c . <<< "$adaptors" || true)
          unpinned=$(grep -vxE '@openfn/language-[a-z0-9-]+@[0-9]+\.[0-9]+\.[0-9]+' <<< "$adaptors" || true)
          renovate=$(grep -cxE '\s*adaptor: "@openfn/language-[a-z0-9-]+@[0-9]+\.[0-9]+\.[0-9]+"' "$spec" || true)
          if [ "$jobs" -eq 0 ] || [ -n "$unpinned" ] || [ "$renovate" -ne "$jobs" ]; then
            echo "::error file=$spec::Pin each job's adaptor to an exact version, written as adaptor: \"@openfn/language-<name>@x.y.z\""
            echo "jobs: $jobs, written in Renovate's form: $renovate"
            if [ -n "$unpinned" ]; then echo "not pinned: $unpinned"; fi
            exit 1
          fi

  agent-runner:
    name: Agent runner tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-mifos-sandbox/pi-agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No dependencies: tests/fake-pi.mjs stands in for Pi.
      - name: Test the runner
        run: node --test tests/*.test.mjs

  agent-image:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build only: catches a file the image needs but the repository lacks,
      # or an update that breaks the image.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: agentic-mifos-sandbox/pi-agent
          push: false
          cache-from: type=gha,scope=sandbox-agent
          cache-to: type=gha,mode=max,scope=sandbox-agent
