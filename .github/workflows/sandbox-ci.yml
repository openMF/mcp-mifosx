name: Sandbox CI

on:
  push:
    branches: ['main']
    paths:
      - 'agentic-mifos-sandbox/**'
      - 'agentic-banking-openfn/openfn/project.yaml'
      - '.github/workflows/sandbox-ci.yml'
      # The demo draws its constancia with Pillow in the MCP server's image.
      - 'python/requirements.txt'
      - 'python/Dockerfile'
  pull_request:
    branches: ['main']
    paths:
      - 'agentic-mifos-sandbox/**'
      - 'agentic-banking-openfn/openfn/project.yaml'
      - '.github/workflows/sandbox-ci.yml'
      # The demo draws its constancia with Pillow in the MCP server's image.
      - 'python/requirements.txt'
      - 'python/Dockerfile'

permissions:
  contents: read

jobs:
  hardening:
    name: Compose hardening
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-mifos-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The compose file requires its secrets: generate throwaway ones.
      - name: Generate a throwaway .env
        run: ./scripts/gen-secrets.sh

      - name: Check the hardening baseline
        run: |
          docker compose --profile ollama --profile agents config --format json > "$RUNNER_TEMP/compose.json"
          python3 scripts/check-hardening.py < "$RUNNER_TEMP/compose.json"

      # The only route out the OpenFn worker can be given: an Ollama on the host.
      - name: Check the hardening baseline with docker-compose.host-ollama.yml
        run: |
          docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml --profile ollama --profile agents \
            config --format json > "$RUNNER_TEMP/compose-host-ollama.json"
          python3 scripts/check-hardening.py < "$RUNNER_TEMP/compose-host-ollama.json"

  adaptors:
    name: OpenFn adaptors pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Every job's adaptor must be an exact version (@latest, a range or no
      # version installs whatever npm serves), written in the form
      # renovate.json updates. yq reads the values themselves, so a comment
      # on the line cannot hide one.
      - name: Check the adaptor versions
        run: |
          spec=agentic-banking-openfn/openfn/project.yaml
          adaptors=$(yq '.workflows[].jobs[].adaptor' "$spec")
          jobs=$(grep -c . <<< "$adaptors" || true)
          unpinned=$(grep -vxE '@openfn/language-[a-z0-9-]+@[0-9]+\.[0-9]+\.[0-9]+' <<< "$adaptors" || true)
          renovate=$(grep -cxE '\s*adaptor: "@openfn/language-[a-z0-9-]+@[0-9]+\.[0-9]+\.[0-9]+"' "$spec" || true)
          if [ "$jobs" -eq 0 ] || [ -n "$unpinned" ] || [ "$renovate" -ne "$jobs" ]; then
            echo "::error file=$spec::Pin each job's adaptor to an exact version, written as adaptor: \"@openfn/language-<name>@x.y.z\""
            echo "jobs: $jobs, written in Renovate's form: $renovate"
            if [ -n "$unpinned" ]; then echo "not pinned: $unpinned"; fi
            exit 1
          fi

      # The worker has no route to npm: every job's adaptor must be built into
      # its image, and the image holds no other.
      - name: Check the adaptors built into the worker image
        working-directory: agentic-mifos-sandbox
        run: python3 scripts/check-worker-adaptors.py ../agentic-banking-openfn/openfn/project.yaml worker/package.json

  agent-runner:
    name: Agent runner tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-mifos-sandbox/pi-agent
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # No dependencies: tests/fake-pi.mjs stands in for Pi.
      - name: Test the runner
        run: node --test tests/*.test.mjs

  agent-image:
    name: Build agent image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Build only: catches a file the image needs but the repository lacks,
      # or an update that breaks the image.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: agentic-mifos-sandbox/pi-agent
          push: false
          cache-from: type=gha,scope=sandbox-agent
          cache-to: type=gha,mode=max,scope=sandbox-agent

  worker-image:
    name: Build worker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # npm ci fails when package-lock.json no longer matches package.json, and
      # the build loads each adaptor under the name the worker looks it up by.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: agentic-mifos-sandbox/worker
          push: false
          cache-from: type=gha,scope=sandbox-worker
          cache-to: type=gha,mode=max,scope=sandbox-worker

  demo:
    name: Demo script
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-mifos-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Lint with ruff
        run: |
          pip install ruff==0.16.10
          ruff check scripts/demo.py scripts/demo_constancia.py

      # The demo reads its ports, webhook triggers and keys from the compose
      # configuration and .env: a renamed setting fails here, not in a demo.
      - name: Generate a throwaway .env
        run: ./scripts/gen-secrets.sh

      - name: Check the demo's configuration
        run: python3 scripts/demo.py --check-config

      # The demo draws each constancia with Pillow in the MCP server's image,
      # under the name docker compose gives it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the MCP server's image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: python
          file: python/Dockerfile
          push: false
          load: true
          tags: agentic-mifos-sandbox-mcp-decision:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Draw a constancia in the MCP server's image
        run: |
          docker compose --profile ollama run --rm --no-deps -T --entrypoint python \
            mcp-decision - PRUE000000HDFRBA01 "Ana Demo Ficticia" < scripts/demo_constancia.py > "$RUNNER_TEMP/curp.png"
          python3 -c 'import sys; png = open(sys.argv[1], "rb").read(); assert png.startswith(b"\x89PNG\r\n\x1a\n") and len(png) > 10000, len(png)' \
            "$RUNNER_TEMP/curp.png"
