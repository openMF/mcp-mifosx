server:
  port: 8080

spring:
  application:
    name: agentic-banking-temporal
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers:
      - task-queue: ${TEMPORAL_TASK_QUEUE:loan-underwriter-queue}
        name: loan-worker
        workflow-classes:
          - org.community.mifos.agentic.loan.workflow.SupervisorWorkflowImpl
        activity-beans:
          - loanActivities
          - fineractActivities
          - ollamaAgentActivities

loan:
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:nemotron-3.5-lightning:latest}
    vision-model: ${OLLAMA_VISION_MODEL:llava:13b}
    temperature: 0.1
    timeout-seconds: 120
  fineract:
    base-url: ${FINERACT_BASE_URL:https://sandbox.mifos.community/fineract-provider/api/v1}
    username: ${FINERACT_USER:mifos}
    password: ${FINERACT_PASSWORD:password}
    tenant-id: ${FINERACT_TENANT:default}
    default-product-id: 1
    default-office-id: 1
  ocr:
    tesseract-bin: ${TESSERACT_BIN:tesseract}
    pdftoppm-bin: ${PDFTOPPM_BIN:pdftoppm}
  curp:
    max-issue-age-days: 30
  mock-data:
    enabled: true
    bank-base-url: http://localhost:3233

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.community.mifos.agentic.loan: INFO
    org.community.mifos.agentic.loan.fineract: DEBUG
    io.temporal: INFO
